<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FoodORM{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5722;
      --dark: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --green: #00b894;
      --text: #eee;
      --muted: #888;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }
    nav {
      background: var(--card);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 64px;
      border-bottom: 2px solid var(--orange);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--orange); text-decoration: none; }
    .nav-brand span { color: var(--text); }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color .2s; }
    nav a:hover { color: var(--orange); }
    .main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; }
    h2 { font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 1rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.5rem; border: 1px solid #2a2a4a; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-green { background: #00b89420; color: var(--green); }
    .badge-orange { background: #ff572220; color: var(--orange); }
    .badge-red { background: #e9456020; color: var(--accent); }
    .badge-gray { background: #88888820; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.75rem 1rem; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; border-bottom: 1px solid #2a2a4a; }
    td { padding: 0.85rem 1rem; border-bottom: 1px solid #1e1e3a; font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #ffffff05; }
    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border-radius: 12px; padding: 1.5rem; border-left: 4px solid var(--orange); }
    .stat-num { font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800; color: var(--orange); }
    .stat-label { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/">🍔 Food<span>ORM</span></a>
    <a href="/">Dashboard</a>
    <a href="/restaurants/">Restaurants</a>
    <a href="/orders/">Orders</a>
    <a href="/customers/">Customers</a>
    <a href="/agents/">Agents</a>
    <a href="/admin/" style="margin-left:auto; color: var(--orange);">Admin ↗</a>
  </nav>
  <div class="main">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
